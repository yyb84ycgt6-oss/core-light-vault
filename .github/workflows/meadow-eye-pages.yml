# Publishes MEADOW EYE OS (meadow-eye/public) to GitHub Pages on every push to
# main that touches it. One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Deploy MEADOW EYE OS

on:
  push:
    branches: [main]
    paths:
      - 'meadow-eye/**'
      - '.github/workflows/meadow-eye-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: meadow-eye
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meadow-eye/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: meadow-eye/public
      - id: deployment
        uses: actions/deploy-pages@v4
